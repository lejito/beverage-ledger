sonar.projectKey=T-cordoba_beverage-ledger
sonar.organization=t-cordoba

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated by `pnpm api:types` from the API's OpenAPI document, not hand-written source.
sonar.exclusions=src/lib/api/schema.d.ts

# Coverage is reported only for the modules the suite in tests/ actually executes.
# Sonar patterns cannot be negated, so the complement is spelled out; anything not
# listed here is one of the 21 files in vitest.config.mts `coverage.include`.
# A file left in would be counted as 0% and would misreport what is under test.
sonar.coverage.exclusions=\
  src/**/*.tsx,\
  src/**/index.ts,\
  src/**/*.d.ts,\
  src/app/**,\
  src/components/**,\
  src/i18n/**,\
  src/styles/**,\
  src/config/branding.ts,\
  src/features/auth/**,\
  src/features/catalog/useCatalogFilters.ts,\
  src/features/dashboard/**,\
  src/features/locations/**,\
  src/features/movements/api.ts,\
  src/features/movements/movement-types.ts,\
  src/features/reports/api.ts,\
  src/features/reports/keys.ts,\
  src/features/stock/api.ts,\
  src/features/stock/keys.ts,\
  src/lib/api/types.ts,\
  src/lib/hooks/useManualRefresh.ts,\
  src/lib/hooks/usePagination.ts,\
  src/lib/query/**,\
  src/lib/utils/**
