name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes a pull request run, but never a
# run on the default branch: that one may be deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

# One job per stage, chained with `needs` like the stages of the Jenkinsfile:
# a failing job stops every job after it. Each job runs on a fresh runner, so
# each sets up again; the pnpm cache keeps that to seconds.
jobs:
  install:
    name: Instalación de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

  static:
    name: Revisión estática
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Formato
        run: pnpm format:check

  unit:
    name: Pruebas unitarias
    needs: static
    runs-on: ubuntu-latest
    env:
      # src/config/api.ts refuses to load without it; no test calls it.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Pruebas unitarias con coverage
        run: pnpm test:unit --coverage --coverage.reportsDirectory=coverage/unit
      - name: Guardar el reporte de coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/lcov.info
          retention-days: 7

  build:
    name: Compilación
    needs: unit
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Compilación
        run: pnpm build
      # The browser jobs below serve this exact build instead of compiling again.
      - name: Guardar la compilación
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  functional:
    name: Pruebas de regresión · Pruebas funcionales
    needs: build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Pruebas funcionales con coverage
        run: pnpm test:funcional --coverage --coverage.reportsDirectory=coverage/funcional
      - name: Guardar el reporte de coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-funcional
          path: coverage/funcional/lcov.info
          retention-days: 7

  security:
    name: Pruebas de regresión · Pruebas de seguridad
    needs: functional
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Pruebas de seguridad
        run: pnpm test:seguridad
      # Production dependencies only: dev tooling never reaches Vercel.
      - name: Auditoría de dependencias
        run: pnpm audit --prod --audit-level high

  # The compiled app against the API deployed on Render, through dedicated CI
  # accounts. One run at a time: every browser suite shares the login rate limit.
  screenplay:
    name: Pruebas de regresión · Pruebas automatizadas (Screenplay + Serenity)
    needs: security
    runs-on: ubuntu-latest
    concurrency: { group: render-api, cancel-in-progress: false }
    env: &browser-suites
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      CI_ADMIN_EMAIL: ${{ secrets.CI_ADMIN_EMAIL }}
      CI_ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD }}
      CI_MANAGER_EMAIL: ${{ secrets.CI_MANAGER_EMAIL }}
      CI_MANAGER_PASSWORD: ${{ secrets.CI_MANAGER_PASSWORD }}
      CI_OPERATOR_EMAIL: ${{ secrets.CI_OPERATOR_EMAIL }}
      CI_OPERATOR_PASSWORD: ${{ secrets.CI_OPERATOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      # Serenity BDD's report CLI is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Navegador
        run: pnpm exec playwright install --with-deps chromium
      - name: Escenarios Screenplay
        run: pnpm test:screenplay
      - name: Reporte de Serenity BDD
        if: always()
        run: pnpm test:screenplay:report
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-bdd
          path: target/site/serenity
          retention-days: 14

  e2e:
    name: Pruebas E2E
    needs: screenplay
    runs-on: ubuntu-latest
    concurrency: { group: render-api, cancel-in-progress: false }
    env: *browser-suites
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Navegador
        run: pnpm exec playwright install --with-deps chromium
      - name: Pruebas E2E
        run: pnpm test:e2e
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            reports/e2e
            test-results
          retention-days: 14

  quality:
    name: Calidad (SonarQube Cloud)
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs the full history to attribute code and compute "new code".
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Recuperar los reportes de coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
      # download-artifact puts each one in a folder named after it.
      - name: Ordenar los reportes como los espera sonar-project.properties
        run: |
          mkdir -p coverage/unit coverage/funcional
          mv coverage/coverage-unit/lcov.info coverage/unit/lcov.info
          mv coverage/coverage-funcional/lcov.info coverage/funcional/lcov.info
      # sonar-project.properties carries the analysis settings; the
      # organization and project key come from repository variables so the
      # same file serves whichever SonarQube Cloud account imports the repo.
      # qualitygate.wait fails this job when the gate fails, so nothing ships.
      - name: Análisis y umbral de calidad
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

  deploy:
    name: Despliegue
    needs: quality
    # Production moves only from the default branch, never from a pull request.
    # Vercel's git deployments are off (vercel.json), so this is the only way in.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # NEXT_PUBLIC_API_URL is deliberately absent here: the production build
    # takes it from the Vercel project, pulled below.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Despliegue en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel@62.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@62.0.0 build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@62.0.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
